[phases.setup]
nixPkgs = ["php", "composer", "nodejs"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan config:clear && php artisan cache:clear && php artisan config:cache && php artisan route:cache && php -S 0.0.0.0:$PORT -t public"